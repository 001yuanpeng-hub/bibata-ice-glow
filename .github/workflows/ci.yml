name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile C# modules with csc.exe and run self-test + diagnose
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $csFiles = @(Get-ChildItem -LiteralPath 'src' -Filter '*.cs' | Sort-Object Name | ForEach-Object { $_.FullName })
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $outExe = Join-Path (Get-Location).Path 'dist\BibataIceTrail.exe'
          $manifest = Join-Path (Get-Location).Path 'src\app.manifest'
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /unsafe /warnaserror `
            "/win32manifest:$manifest" `
            /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            "/out:$outExe" @csFiles
          if ($LASTEXITCODE -ne 0) { throw "csc.exe failed with exit code $LASTEXITCODE" }

          $selfTestLog = Join-Path $env:TEMP 'ci_selftest.log'
          $p1 = Start-Process -FilePath $outExe -ArgumentList @('--self-test', "`"$selfTestLog`"") -Wait -PassThru
          if (Test-Path -LiteralPath $selfTestLog) { Get-Content -LiteralPath $selfTestLog }
          if ($p1.ExitCode -ne 0) { throw "--self-test failed with exit code $($p1.ExitCode)" }

          $diagLog = Join-Path $env:TEMP 'ci_diagnose.txt'
          $p2 = Start-Process -FilePath $outExe -ArgumentList @('--diagnose', "`"$diagLog`"") -Wait -PassThru
          if (Test-Path -LiteralPath $diagLog) { Get-Content -LiteralPath $diagLog }
          if ($p2.ExitCode -ne 0) { throw "--diagnose failed with exit code $($p2.ExitCode)" }

      - name: Run PSScriptAnalyzer (zero Error-severity findings)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $targets = @('install.ps1', 'uninstall.ps1', 'src\InstallCommon.ps1', 'src\InstallState.ps1')
          $errors = @()
          foreach ($t in $targets) {
            $findings = @(Invoke-ScriptAnalyzer -Path $t -Severity Error)
            if ($findings.Count -gt 0) {
              $findings | Format-Table ScriptName, Line, RuleName, Message -AutoSize | Out-String | Write-Host
              $errors += $findings
            }
          }
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($errors.Count) Error-severity finding(s)."
          }
          Write-Host "PSScriptAnalyzer passed with 0 Error findings."

      - name: Run isolated install/uninstall regression suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\test-install-uninstall.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release binary and checksums
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $csFiles = @(Get-ChildItem -LiteralPath 'src' -Filter '*.cs' | Sort-Object Name | ForEach-Object { $_.FullName })
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $outExe = Join-Path (Get-Location).Path 'dist\BibataIceTrail.exe'
          $manifest = Join-Path (Get-Location).Path 'src\app.manifest'
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /unsafe /warnaserror `
            "/win32manifest:$manifest" `
            /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            "/out:$outExe" @csFiles
          if ($LASTEXITCODE -ne 0) { throw "csc.exe failed with exit code $LASTEXITCODE" }

          Copy-Item -LiteralPath 'config.example.ini' -Destination 'dist\config.example.ini' -Force
          $hashExe = (Get-FileHash -LiteralPath 'dist\BibataIceTrail.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashCfg = (Get-FileHash -LiteralPath 'dist\config.example.ini' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$hashExe  BibataIceTrail.exe"
            "$hashCfg  config.example.ini"
          ) | Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/BibataIceTrail.exe
            dist/config.example.ini
            dist/SHA256SUMS.txt
