# Bibata Ice Glow — Example Configuration / 示例配置文件
# Copy to <InstallDir>\Bibata-Ice-Trail\config.ini and restart BibataIceTrail.exe to apply.
# 复制到 <安装目录>\Bibata-Ice-Trail\config.ini 并重启 BibataIceTrail.exe 后生效。
# Note: config.ini is automatically created/updated when you change settings via hotkeys or tray menu.
# 说明：首次安装默认不强制生成 config.ini，按快捷键或通过托盘菜单修改设置时会自动生成。

[BibataIceTrail]

# Master switch for all visual effects / 光影特效总开关 (true / false)
Enabled=true

# Luminous cursor motion trail / 滑动冰蓝流光拖尾 (true / false)
TrailEnabled=true

# Click ripple rings (left/middle single ring, right double ring) / 点击波纹 (true / false)
ClickRippleEnabled=true

# Soft glow ring while holding left mouse button to drag / 按住左键拖拽柔光反馈 (true / false)
DragGlowEnabled=true

# Pulse beacon when shaking cursor rapidly to locate it / 快速甩动定位指针光环 (true / false)
ShakeLocateEnabled=true

# Subtle directional arc above/below cursor when scrolling while stationary / 滚轮方向微光弧 (true / false)
ScrollGlowEnabled=true

# Global hotkeys: Ctrl+Alt+Shift+G/C/S/D / 全局快捷键开关 (true / false)
HotkeyEnabled=true

# Effect intensity preset / 光影强度预设:
#   0 = Light (轻盈冰光)
#   1 = Standard (标准冰蓝，默认推荐)
#   2 = Vivid (灵动流光)
Preset=1

# Color palette / 光影配色:
#   0 = Ice (冰蓝，默认)
#   1 = Cyan (极光青)
#   2 = Frost (霜白)
#   3 = Custom (使用下方 CustomColor)
#   4 = PinkBlue (粉蓝幻梦双色渐变)
#   5 = Rainbow (流光七彩全光谱渐变)
Palette=0

# Custom hex color used when Palette=3 / 自定义纯色（当 Palette=3 时生效）
CustomColor=#A78BFA

# Automatically hide overlay during exclusive Direct3D fullscreen games / 独占全屏 Direct3D 游戏自动暂停 (true / false)
AutoPauseFullscreen=true

# Show system tray icon (false = silent background mode) / 是否显示托盘图标（默认 false 静默后台运行）
ShowTrayIcon=false
